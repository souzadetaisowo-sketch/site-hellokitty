<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <h1>Realize seu cadastro para ficar por dentro dentro das novidades do mundo HelloKitty!</h1>
    </header>

<main>
<form action="#" method="post"
    <p><label for="nome">Nome:</label><br></p>
        <input type="text" id="nome" name="nome"></p>
    <p><label for="email">Email:</label></p>
        <input type="email" id="email" name="email"></p>
    <p><label for="tel">Telefone:</label></p>
        <input type="tel" id="tel" name="tel"
        placeholder="(81) 99999-99">
    <p><label for="nasc">Data de Nascimento:</label><br>
        <input type="date" id="nasc" name="nasc"></p>
    <p><label for="conta">Possui mais de uma conta?</label><br>
        <select name="conta" id="conta">
            <option value="sim">sim</option>
            <option value="nao">não</option>
        </select></p>
<p><label for="personagem">Qual seu persongaem favorito da Sanrio?</label><br></p>
        <input type="text" id="personagem" name="personagem"></p>
<p><label for="idade">Qual sua idade?</label><br>
    <input type="number" id="idade" name="idade"
        min="10" max="100"></p>
        
        <button type="submit">Cadastrar</button>

        <p><label for="cachorro">Qual o nome do seu cachorro?</label></p>
        <input type="text" id="cachorro" name="cachorro"

        <p><label for="possui">Ah esqueci de perguntar você tem um?</label></p>
            <select name="possui" id="possui">
                <option value="Não, só gatos"></option>
                <option value="">Não, só hamsters</option>
                <option value="">Não, sou gay</option>
                <option value="">Não, até porque se eu tivesse eu ia preencher o ngc</option>
            </select>

    </form>

</main>

</body>
</html>
